<title>Army Rush</title>
<meta name="description" content="Runner-Shooter: Armee durch Tore führen, Fässer und Gegner abschießen, Boss besiegen, dauerhaft upgraden.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: Vollbild-3D-Szene, schwebende HUD-Pillen oben, Menü-Karte unten (Daumenzone). Bewusst ein einziges helles Arcade-Theme. */
:root{
  --ink:#1b2333; --ink-soft:#4a5468; --paper:#ffffff; --paper-2:#eef3fb;
  --blue:#2f7cf6; --blue-dk:#1f5fcf; --green:#24b35a; --red:#e5443a; --gold:#ffbf2e; --gold-dk:#d99a0c;
  --display:"Lilita One","Arial Black",Impact,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#8fd3f7;color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px;pointer-events:none;z-index:5}
.pill{background:rgba(27,35,51,.78);color:#fff;border-radius:999px;padding:6px 12px;font-family:var(--display);font-size:17px;letter-spacing:.02em;white-space:nowrap;
  font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.coin{display:inline-block;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b8,var(--gold) 45%,var(--gold-dk));box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.bar{flex:1;min-width:0;height:22px;border-radius:999px;background:rgba(27,35,51,.6);position:relative;overflow:hidden}
.bar i{position:absolute;inset:3px auto 3px 3px;width:0;border-radius:999px;background:linear-gradient(#5fa2ff,var(--blue))}
.bar b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:15px var(--display)}
.weapon{position:fixed;top:calc(env(safe-area-inset-top,0px) + 48px);left:max(12px,env(safe-area-inset-left,0px));z-index:5;pointer-events:none;font-size:14px;padding:4px 10px}
.banner{position:fixed;left:0;right:0;top:20%;text-align:center;font-family:var(--display);color:#fff;font-size:44px;line-height:1.05;
  text-shadow:0 4px 0 rgba(0,0,0,.25);pointer-events:none;z-index:6;opacity:0;transition:opacity .35s}
.banner small{display:block;font-size:20px;margin-top:6px}
.banner.show{opacity:1}
.pop{position:fixed;font-family:var(--display);font-size:26px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3);pointer-events:none;z-index:6;
  transform:translate(-50%,-50%);animation:pop .9s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{opacity:0;margin-top:10px;scale:.6}15%{opacity:1;scale:1.15}100%{opacity:0;margin-top:-50px;scale:1}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,rgba(20,30,50,.55),rgba(20,30,50,0));padding-top:60px}
.card{width:100%;max-width:440px;background:var(--paper);border-radius:22px;padding:16px;box-shadow:0 12px 30px rgba(10,20,40,.3);
  display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 120px);overflow:auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.logo{font-family:var(--display);font-size:34px;line-height:.9;color:var(--blue);letter-spacing:.01em}
.logo span{color:var(--red)}
.lvl{font-family:var(--display);font-size:20px;color:var(--ink);text-align:right}
.lvl small{display:block;font-family:var(--body);font-size:12px;font-weight:800;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:var(--paper-2);color:var(--ink-soft)}
.chip.mod{background:#fff2d1;color:#8a5b00}
.chip.elite{background:#ffe0dd;color:#a3231a}
.chip.new{background:#dcebff;color:#1f5fcf}
.ups{display:flex;flex-direction:column;gap:6px}
.up{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;background:var(--paper-2);border-radius:14px;padding:8px 8px 8px 12px}
.up .t{min-width:0}
.up .n{font-weight:900;font-size:15px}
.up .n em{font-style:normal;color:var(--ink-soft);font-weight:800;font-size:12px;margin-left:4px}
.up .d{font-size:13px;color:var(--ink-soft);font-weight:700;font-variant-numeric:tabular-nums}
.buy{border:0;border-radius:12px;padding:8px 12px;min-width:92px;font:17px var(--display);color:#fff;background:var(--green);box-shadow:0 3px 0 #178a42;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;font-variant-numeric:tabular-nums}
.buy:disabled{background:#b8c0cc;box-shadow:0 3px 0 #98a1ae;cursor:default}
.buy:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 #178a42}
.go{border:0;border-radius:16px;padding:14px;font:26px var(--display);color:#fff;background:var(--blue);box-shadow:0 5px 0 var(--blue-dk);cursor:pointer;letter-spacing:.02em}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-dk)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.note{font-size:12px;color:var(--ink-soft);font-weight:700;text-align:center}
.result{font-family:var(--display);font-size:40px;text-align:center;line-height:1}
.result.win{color:var(--green)} .result.lose{color:var(--red)}
.reward{display:flex;justify-content:center;align-items:center;gap:8px;font:28px var(--display)}
.reward .coin{width:24px;height:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.stats div{background:var(--paper-2);border-radius:12px;padding:8px 4px;font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.stats b{display:block;font:22px var(--display);color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);text-align:center;color:#fff;font:20px var(--display);
  text-shadow:0 2px 0 rgba(0,0,0,.3);pointer-events:none;z-index:6;transition:opacity .4s}
.err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-weight:800;background:#8fd3f7;z-index:20}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s}.banner{transition:none}}
</style>

<canvas id="c"></canvas>
<div class="hud" id="hud" hidden>
  <div class="pill" id="hLvl">Lv 1</div>
  <div class="bar"><i id="hBar"></i><b id="hBoss">BOSS</b></div>
  <div class="pill"><span class="coin"></span><span id="hCoins">0</span></div>
</div>
<div class="pill weapon" id="hWeapon" hidden>Pistole</div>
<div class="banner" id="banner"></div>
<div class="hint" id="hint" hidden>Ziehen zum Lenken</div>

<div class="sheet" id="menu" hidden>
  <div class="card">
    <div class="head">
      <div class="logo">ARMY<br><span>RUSH</span></div>
      <div class="lvl"><small id="mTheme">Brücke</small>Level <span id="mLvl">1</span></div>
    </div>
    <div class="chips" id="mChips"></div>
    <div class="ups" id="ups"></div>
    <button class="go" id="btnGo" type="button">LOS!</button>
    <div class="note"><span class="coin" style="width:11px;height:11px;vertical-align:-1px"></span> <span id="mCoins">0</span> Münzen · Fortschritt wird auf diesem Gerät gespeichert</div>
  </div>
</div>

<div class="sheet" id="end" hidden>
  <div class="card">
    <div class="result" id="eTitle">SIEG!</div>
    <div class="stats">
      <div>Armee<b id="eArmy">0</b></div>
      <div>Kills<b id="eKills">0</b></div>
      <div>Strecke<b id="eProg">0%</b></div>
    </div>
    <div class="reward">+<span id="eCoins">0</span><span class="coin"></span></div>
    <button class="go" id="btnNext" type="button">WEITER</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

// ---------- Speicherstand (dauerhaft, nur lokal im Browser) ----------
const SAVE_KEY = 'armyRush.v1';
const save = { level: 1, coins: 0, best: 1, up: { start: 0, rate: 0, dmg: 0, range: 0, income: 0 } };
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (s && s.up) { Object.assign(save.up, s.up); save.level = s.level | 0 || 1; save.coins = s.coins | 0; save.best = s.best | 0 || 1; }
} catch (e) {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

// ---------- Werte der Upgrades ----------
const stat = {
  start: l => 5 + 3 * l,
  rate: l => 1.6 * (1 + 0.08 * l),
  dmg: l => 1 + 0.15 * l,
  range: l => 18 + 2 * l,
  income: l => 1 + 0.1 * l,
};
const UPG = [
  { k: 'start',  n: 'Start-Truppe', base: 20, g: 1.30, max: 50, d: l => stat.start(l) + ' Soldaten' },
  { k: 'rate',   n: 'Feuerrate',    base: 25, g: 1.32, max: 50, d: l => stat.rate(l).toFixed(2) + ' Schuss/s' },
  { k: 'dmg',    n: 'Schaden',      base: 25, g: 1.32, max: 50, d: l => stat.dmg(l).toFixed(2) + ' pro Treffer' },
  { k: 'range',  n: 'Reichweite',   base: 40, g: 1.55, max: 8,  d: l => stat.range(l) + ' m' },
  { k: 'income', n: 'Münz-Bonus',   base: 45, g: 1.45, max: 20, d: l => '+' + Math.round((stat.income(l) - 1) * 100) + ' %' },
];
const cost = (u, l) => Math.round(u.base * Math.pow(u.g, l));
const WEAPONS = [{ n: 'Pistole', m: 1 }, { n: 'Uzi', m: 1.35 }, { n: 'Sturmgewehr', m: 1.8 }, { n: 'Minigun', m: 2.4 }];
const HELMETS = [0x2fa84f, 0x2f7cf6, 0xf2c230, 0x8e4cf0, 0x1b2333];

const THEMES = [
  { n: 'Brücke',    sky: 0x8fd3f7, road: 0xd9d6cf, dots: '#c3bfb5', ground: null,     water: 0x2d8fd6, deco: 'pylon' },
  { n: 'Wüste',     sky: 0xf6d29a, road: 0xcbb692, dots: '#b29d77', ground: 0xe2b56d, deco: 'cactus' },
  { n: 'Gletscher', sky: 0xcfe8f8, road: 0xa9b7c6, dots: '#93a2b3', ground: 0xf1f6fb, deco: 'pine' },
  { n: 'Abendrot',  sky: 0xf4a07a, road: 0x9e8d93, dots: '#86757b', ground: 0x6b4a6e, deco: 'rock' },
  { n: 'Dschungel', sky: 0x9fe0c4, road: 0xbcad8e, dots: '#a39477', ground: 0x4f9a4a, deco: 'tree' },
];
const MODS = [
  { id: 'gold',    n: 'Goldrausch', d: '+50 % Münzen' },
  { id: 'horde',   n: 'Horde',      d: '+50 % Gegner' },
  { id: 'barrels', n: 'Fasslager',  d: 'mehr Fässer, doppelte Beute' },
  { id: 'lucky',   n: 'Glückstore', d: 'Tore +30 %' },
  { id: 'sprint',  n: 'Sprint',     d: '+25 % Tempo' },
];
const BOSSES = ['Brecher', 'Koloss', 'Eisenfaust', 'Grimm', 'Titan', 'Bulldozer', 'Granit'];

// ---------- Zufall mit Seed: gleiches Level = gleicher Aufbau ----------
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const HALF = 6;          // halbe Straßenbreite
const RUN_SPEED = 10;
const BSPEED = 46;
const MAXVIS = 200;      // sichtbare Soldaten (Zahl darüber nur im Label)
const SP = 0.34;         // Abstand in der Formation

// Gegnertypen: werden nach und nach freigeschaltet (from = erstes Level)
const KINDS = {
  grunt:  { n: 'Soldaten',     from: 1, helm: 0xd8322a, body: 0xf0a3a3, hp: 1,   sp: [3, 4.5],   size: 1,    cnt: 1 },
  runner: { n: 'Sprinter',     from: 2, helm: 0xff9f1a, body: 0xffd59a, hp: 0.6, sp: [6.5, 8],   size: 0.85, cnt: 0.7 },
  shield: { n: 'Schildträger', from: 4, helm: 0x4a5566, body: 0x9aa6b5, hp: 3.5, sp: [1.8, 2.4], size: 1.15, cnt: 0.45 },
  gunner: { n: 'Schützen',     from: 6, helm: 0x8e44d8, body: 0xd8b8f4, hp: 1.6, sp: [0, 0],     size: 1,    cnt: 0.4, shoots: true },
  brute:  { n: 'Riesen',       from: 8, helm: 0x2f5d3a, body: 0x86b394, hp: 16,  sp: [1.6, 2],   size: 2.3,  cnt: 0.08 },
};
const UNLOCKS = { 2: 'Sprinter: schnell, laufen direkt auf dich zu', 3: 'Kreissägen: ausweichen, nicht abschießbar', 4: 'Schildträger + Boss ruft Verstärkung',
  6: 'Schützen: schießen zurück', 7: 'Boss wird bei wenig HP wütend', 8: 'Riesen: zerquetschen viele Soldaten', 10: 'Doppelte Gegnerwellen' };

function genLevel(l) {
  const rnd = mulberry32(l * 7919 + 1337);
  // S: Gegnerstärke, Gs: Tor-/Belohnungswachstum (wächst langsamer -> Upgrades werden nötig)
  const S = Math.pow(1.18, l - 1); const Gs = Math.pow(S, 0.8), E = 1 + 0.1 * (l - 1);
  const theme = THEMES[(l - 1) % THEMES.length];
  const mod = (l >= 3 && rnd() < 0.65) ? MODS[Math.floor(rnd() * MODS.length)] : null;
  const has = id => !!mod && mod.id === id;
  const elite = l % 5 === 0;
  const len = Math.min(230 + l * 12, 520);
  const gateMul = has('lucky') ? 1.3 : 1;
  const kinds = Object.keys(KINDS).filter(k => KINDS[k].from <= l);

  const gateVal = good => {
    if (good) return rnd() < Math.max(0.12, 0.26 - l * 0.006) ? { op: 'mul', v: rnd() < (l >= 12 ? 0.92 : 0.8) ? 2 : 3 } : { op: 'add', v: Math.max(3, Math.round((4 + rnd() * 10) * Gs * gateMul)) };
    const r = rnd();
    if (r < 0.2) return { op: 'div', v: l >= 8 && rnd() < 0.4 ? 3 : 2 };
    return { op: 'add', v: -Math.max(2, Math.round((3 + rnd() * 9) * Math.pow(S, 0.95))) };
  };
  const enemyGroup = (z, x, kind) => {
    const K = KINDS[kind], prog = Math.min(1, -z / len);   // am Levelanfang kleinere Gruppen, zum Ende hin größere
    const cnt = Math.max(1, Math.round((8 + rnd() * 14) * K.cnt * Math.pow(S, 0.92) * (0.35 + 0.95 * prog) * (has('horde') ? 1.5 : 1)));
    return { type: 'enemy', kind, z, x, count: cnt, hpEach: K.hp * Math.pow(S, 0.25) * E, speed: K.sp[0] + rnd() * (K.sp[1] - K.sp[0]) };
  };
  const events = [];
  const gatePair = (z, bothGood) => {
    let a = gateVal(true), b = gateVal(bothGood);
    if (bothGood && a.op === b.op && a.v === b.v) b = { op: 'add', v: a.v + 3 };
    const left = rnd() < 0.5;
    events.push({ type: 'gate', z, gates: [Object.assign({ x0: -HALF, x1: 0 }, left ? a : b), Object.assign({ x0: 0, x1: HALF }, left ? b : a)] });
  };

  let z = -34, prev = '', prev2 = '';
  gatePair(z, true); prev = 'gate'; z -= 30;
  const gap = Math.max(15, 25 - l * 0.6);   // Ereignisse rücken mit jedem Level näher zusammen
  while (z > -len + 20) {
    const w = { gate: 0.34, enemy: 0.36 + Math.min(0.2, l * 0.015), barrel: has('barrels') ? 0.4 : 0.22, saw: l >= 3 ? Math.min(0.22, 0.08 + l * 0.01) : 0 };
    if (prev === prev2) w[prev] = 0;
    const keys = Object.keys(w), tot = keys.reduce((a, k) => a + w[k], 0); let r = rnd() * tot, type = 'gate';
    for (const k of keys) { if ((r -= w[k]) <= 0) { type = k; break; } }
    if (type === 'gate') gatePair(z, rnd() < Math.max(0.1, 0.4 - l * 0.02));
    else if (type === 'enemy') {
      const pool = -z < len * 0.3 ? kinds.filter(k => k === 'grunt' || k === 'runner') : kinds;   // schwere Typen erst ab 30 % Strecke
      const kind = pool[Math.floor(rnd() * pool.length)];
      if (l >= 10 && rnd() < 0.45) {
        const kind2 = kinds[Math.floor(rnd() * kinds.length)];
        events.push(enemyGroup(z, -3, kind), enemyGroup(z - 4, 3, kind2));
      } else events.push(enemyGroup(z, (rnd() - 0.5) * 7, kind));
    } else if (type === 'saw') {
      events.push({ type: 'saw', z, phase: rnd() * 6.28, w: 1.2 + rnd() * 0.8 + l * 0.03, dps: 30 * Math.pow(S, 0.7) });
    } else {
      const two = rnd() < 0.5;
      const xs = two ? [-3, 3] : [(rnd() - 0.5) * 7];
      for (const x of xs) {
        const rr = rnd();
        const reward = rr < 0.35 ? { t: 'weapon' } : rr < 0.75 ? { t: 'troops', v: Math.round((5 + rnd() * 10) * Gs) } : { t: 'coins', v: Math.round(8 + l * 2) };
        if (has('barrels') && reward.v) reward.v *= 2;
        events.push({ type: 'barrel', z, x, hp: Math.round((30 + rnd() * 60) * S * (0.5 + 0.7 * Math.min(1, -z / len)) * (has('barrels') ? 1.4 : 1)), perSoldier: 6 * Math.pow(S, 0.6), reward });
      }
    }
    prev2 = prev; prev = type;
    z -= gap + rnd() * 10;
  }
  const boss = {
    z: -len - 24, name: BOSSES[(l * 3) % BOSSES.length],
    hp: Math.round(520 * S * E * (elite ? 1.4 : 1)),
    hit: Math.max(3, Math.round(3 * Math.pow(S, 0.7) * (elite ? 1.25 : 1))),
    summon: l >= 4, rage: l >= 7,
  };
  const ek = l >= 4 ? 'shield' : 'grunt', esc = enemyGroup(boss.z + 7, 0, ek);
  esc.count = Math.round(esc.count * 1.4); esc.escort = true; esc.speed = 3.2;
  events.push(esc);
  return { l, S, Gs, E, unitHp: Math.pow(S, 0.25) * E, theme, mod, has, elite, len, events, boss, unlock: UNLOCKS[l] };
}

// ---------- Three.js Grundgerüst ----------
if (!window.THREE) { document.body.insertAdjacentHTML('beforeend', '<div class="err">3D-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen und neu laden.</div>'); return; }
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true }); }
catch (e) { document.body.insertAdjacentHTML('beforeend', '<div class="err">WebGL ist auf diesem Gerät nicht verfügbar.</div>'); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 400);
scene.add(new THREE.HemisphereLight(0xffffff, 0x6f7480, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(-6, 14, 8); scene.add(sun);
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w / h < 0.75 ? 62 : 52; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const lam = c => new THREE.MeshLambertMaterial({ color: c });

// Soldaten-Geometrie (geteilt von Armee und Gegnern)
const G = {
  body: new THREE.CylinderGeometry(0.2, 0.25, 0.62, 8).translate(0, 0.52, 0),
  head: new THREE.SphereGeometry(0.16, 10, 8).translate(0, 0.98, 0),
  helm: new THREE.SphereGeometry(0.2, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2).translate(0, 1.02, 0),
  gun:  new THREE.BoxGeometry(0.07, 0.07, 0.5).translate(0.2, 0.72, -0.22),
};
function crowd(max, colors) {
  const parts = Object.keys(colors).map(k => {
    const m = new THREE.InstancedMesh(G[k], lam(colors[k]), max);
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); m.count = 0; m.frustumCulled = false; scene.add(m); return m;
  });
  return parts;
}
const armyParts = crowd(MAXVIS, { body: 0xe9edf2, head: 0xf2c9a0, helm: HELMETS[0], gun: 0x2a2f38 });
const enemyParts = crowd(600, { body: 0xffffff, head: 0xf2c9a0, helm: 0xffffff });
{ const c = new THREE.Color(1, 1, 1); for (const m of [enemyParts[0], enemyParts[2]]) { m.count = 600; for (let i = 0; i < 600; i++) m.setColorAt(i, c); m.count = 0; } }
const KCOL = {};
for (const k in KINDS) KCOL[k] = { body: new THREE.Color(KINDS[k].body), helm: new THREE.Color(KINDS[k].helm) };
const FX = [], FZ = [];

function burst(x, y, z, color, n) {

    parts.push({ x, y, z, vx: (Math.random() - 0.5) * 7, vy: 2 + Math.random() * 6, vz: (Math.random() - 0.5) * 7, life: 0.5 + Math.random() * 0.5, c: color });
}
const projV = new THREE.Vector3();
function pop(x, y, z, text, color) {
  projV.set(x, y, z).project(camera);
  const el = document.createElement('div'); el.className = 'pop'; el.textContent = text; el.style.color = color || '#fff';
  el.style.left = ((projV.x + 1) / 2 * innerWidth) + 'px'; el.style.top = ((1 - projV.y) / 2 * innerHeight) + 'px';
  document.body.appendChild(el); setTimeout(() => el.remove(), 950);
}
const vibrate = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
function banner(html, ms) { const b = $('banner'); b.innerHTML = html; b.classList.add('show'); clearTimeout(banner.t); banner.t = setTimeout(() => b.classList.remove('show'), ms); }

function loseTroops(n, x, z) {
  n = Math.min(N, Math.max(0, Math.round(n))); if (!n) return;
  N -= n; for (let i = 0; i < Math.min(n, 12); i++) { const k = (Math.random() * Math.min(N + n, MAXVIS)) | 0; burst(armyX + FX[k], 0.8, pz + FZ[k], 0x2f7cf6, 2); }
}

// ---------- Treffer ----------
function damage(t, dmg) {
  if (t.kind === 'gate') {
    const g = t.g; g.charge += dmg;
    if (g.charge >= g.step) { const k = Math.floor(g.charge / g.step); g.charge -= k * g.step; g.v += k; }
  } else if (t.kind === 'barrel') {
    const e = t.e; e.hp -= dmg;
    if (e.hp <= 0) {
      e.dead = true; e.mesh.visible = false; burst(e.x, 1, e.z, 0x9a5a2c, 22); vibrate(15);
      const r = e.reward;
      if (r.t === 'weapon') {
        if (weapon < WEAPONS.length - 1) { weapon++; pop(e.x, 2, e.z, WEAPONS[weapon].n.toUpperCase() + '!', '#fff27a'); }
        else { const v = Math.round(10 * L.S); N += v; pop(e.x, 2, e.z, '+' + fmt(v), '#9fd0ff'); }
        $('hWeapon').textContent = WEAPONS[weapon].n;
      } else if (r.t === 'troops') { N += r.v; pop(e.x, 2, e.z, '+' + fmt(r.v), '#9fd0ff'); }
      else { runCoins += r.v; pop(e.x, 2, e.z, '+' + r.v + ' Münzen', '#ffd257'); }
    }
  } else if (t.kind === 'enemy') {
    const e = t.e, before = e.count; e.hp -= dmg;
    e.count = Math.max(0, Math.ceil(e.hp / e.hpEach - 1e-6));
    const k = before - e.count;
    if (k > 0) { kills += k; runCoins += k * 0.15 * stat.income(save.up.income); burst(e.x + (Math.random() - 0.5) * e.r, 0.8, e.z + e.r * 0.5, 0xd8322a, Math.min(k * 2, 8)); }
    if (e.count <= 0) e.dead = true;
  } else if (t.kind === 'boss') {
    const B = bossObj; B.hp -= dmg; B.flash = 0.08;
    if (B.hp <= 0 && !B.dead) { B.dead = true; B.hp = 0; burst(0, 3, B.z, 0xc9302a, 40); vibrate(60); }
  }
}

function findHit(b, oz) {
  let best = null, bz = -Infinity;
  for (const e of L.events) {
    if (e.dead || e.z < b.z - 6 || e.z > oz + 6) continue;
    if (e.type === 'gate') {
      if (e.used || e.z > oz || e.z < b.z) continue;
      for (const g of e.gates) if (g.op === 'add' && b.x >= g.x0 && b.x <= g.x1 && e.z > bz) { best = { kind: 'gate', g }; bz = e.z; }
    } else if (e.type === 'barrel') {
      const f = e.z + 0.9;
      if (b.z <= f && oz >= e.z - 0.9 && Math.abs(b.x - e.x) < 1.15 && f > bz) { best = { kind: 'barrel', e }; bz = f; }
    } else if (e.type === 'enemy') {
      const f = e.z + e.r;
      if (b.z <= f && oz >= e.z - e.r && Math.abs(b.x - e.x) < e.r + 0.25 && f > bz) { best = { kind: 'enemy', e }; bz = f; }
    }
  }
  const B = bossObj;
  if (!B.dead) { const f = B.z + 1.2 * B.scale; if (b.z <= f && oz >= B.z - 2 && Math.abs(b.x) < 1.5 * B.scale && f > bz) best = { kind: 'boss' }; }
  return best;
}

// ---------- Update ----------
function update(dt) {
  timeT += dt;
  const running = state === 'run';
  if (running) {
    // Bewegung
    if (keys.l) armyTX -= 14 * dt; if (keys.r) armyTX += 14 * dt;
    armyTX = Math.max(-HALF + 0.6, Math.min(HALF - 0.6, armyTX));
    armyX += (armyTX - armyX) * Math.min(1, dt * 14);
    if (!bossPhase) { pz -= speed * dt; if (pz <= stopZ) { pz = stopZ; bossPhase = true; banner(L.boss.name.toUpperCase() + '<small>Boss besiegen!</small>', 1400); } }

    // Tore
    for (const e of L.events) {
      if (e.type !== 'gate' || e.used || pz > e.z) continue;
      e.used = true;
      const g = armyX < 0 ? e.gates[0] : e.gates[1];
      const before = N;
      if (g.op === 'add') N += g.v; else if (g.op === 'mul') N *= g.v; else N = Math.floor(N / g.v);
      N = Math.max(0, Math.min(999999, Math.round(N)));
      const diff = N - before;
      pop(armyX, 2.2, pz - 1, (diff >= 0 ? '+' : '−') + fmt(Math.abs(diff)), diff >= 0 ? '#9fd0ff' : '#ff9a90');
      burst(armyX, 1, pz, diff < 0 ? 0xe5443a : 0x2f7cf6, 10);
      vibrate(10);
      for (const gg of e.gates) gg.mesh.visible = false;
    }
    // Fässer rammen
    const ar = armyR();
    for (const e of L.events) {
      if (e.type !== 'barrel' || e.dead) continue;
      if (Math.abs(pz - e.z) < ar * 0.7 + 0.9 && Math.abs(armyX - e.x) < ar * 0.8 + 1.0) {
        e.dead = true; e.mesh.visible = false; burst(e.x, 1, e.z, 0x9a5a2c, 18); shake = 0.35; vibrate(30);
        const n = Math.ceil(e.hp / e.perSoldier); loseTroops(n); pop(e.x, 2, e.z, '−' + fmt(Math.min(n, N + n)), '#ff9a90');
      }
    }
    // Kreissägen
    for (const e of L.events) {
      if (e.type !== 'saw') continue;
      if (Math.abs(pz - e.z) < ar * 0.7 + 0.5 && Math.abs(armyX - e.x) < ar * 0.75 + 1.0) {
        e.acc = (e.acc || 0) + e.dps * dt; const k = Math.floor(e.acc);
        if (k > 0) { e.acc -= k; loseTroops(k); burst(e.x, 1, e.z, 0x2f7cf6, 3); shake = Math.max(shake, 0.2); }
      }
    }
    // Gegner
    for (const e of L.events) {
      if (e.type !== 'enemy' || e.dead) continue;
      const dist = pz - e.z;
      if (dist < (e.escort ? (bossPhase ? 40 : 0) : 48)) e.active = true;
      if (!e.active) continue;
      const contact = dist < ar * 0.8 + e.r * 0.8 && Math.abs(e.x - armyX) < ar + e.r;
      if (contact) {
        // Nahkampf: ein Soldat tauscht sich gegen die HP eines normalen Gegners
        const uh = L.unitHp, need = e.hp / uh;
        const k = Math.min(N, Math.ceil(need), Math.max(1, Math.round(dt * Math.max(25, Math.min(N, need) * 2.5))));
        loseTroops(k);
        const before = e.count; e.hp -= k * uh; e.count = Math.max(0, Math.ceil(e.hp / e.hpEach - 1e-6));
        kills += before - e.count;
        burst(e.x, 0.8, e.z + e.r, KINDS[e.kind].helm, 2); shake = Math.max(shake, e.kind === 'brute' ? 0.3 : 0.12);
        if (e.count <= 0) e.dead = true;
      } else {
        e.z += e.speed * dt;
        e.x += Math.max(-1, Math.min(1, armyX - e.x)) * (e.kind === 'runner' ? 3.5 : 1.2) * dt;
        if (KINDS[e.kind].shoots && dist > 0 && dist < 26) {
          e.fireT -= dt;
          if (e.fireT <= 0) {
            e.fireT = 0.8; loseTroops(Math.max(1, Math.round(e.count * 0.12)));
            for (let i = 0; i < 4 && parts.length < 400; i++) parts.push({ x: e.x + (Math.random() - 0.5) * e.r, y: 1, z: e.z, vx: (armyX - e.x) * 1.5, vy: 3, vz: dist * 1.6, life: 0.6, c: 0xb06cf0 });
          }
        }
      }
      if (e.z > pz + 8) e.dead = true;
    }
    // Boss
    const B = bossObj;
    if (bossPhase && !B.dead) {
      const reach = ar * 0.6 + 1.3 * B.scale;
      if (B.rage && !B.angry && B.hp < B.maxHp * 0.35) { B.angry = true; banner('WUT!<small>' + B.name + ' schlägt schneller zu</small>', 1200); }
      if (pz - B.z > reach) { B.z += (B.angry ? 3 : 1.7) * dt; B.walk = true; }
      else {
        B.walk = false; bossAtk -= dt;
        if (bossAtk <= 0) { bossAtk = B.angry ? 0.55 : 1.0; loseTroops(L.boss.hit); shake = 0.5; vibrate(40); burst(armyX, 0.5, pz - ar * 0.6, 0xffffff, 10); B.swing = 0.35; }
      }
      if (B.summon) {
        B.sumT = (B.sumT === undefined ? 2.5 : B.sumT) - dt;
        if (B.sumT <= 0) {
          B.sumT = 5;
          const e = { type: 'enemy', kind: 'grunt', z: B.z + 1.5 * B.scale, x: (Math.random() - 0.5) * 6, count: Math.round(6 * Math.pow(L.S, 0.9)), hpEach: L.unitHp, speed: 4 };
          initEnemy(e); e.active = true; L.events.push(e);
        }
      }
    }
    // Schießen
    if (N > 0) {
      const rate = stat.rate(save.up.rate) * WEAPONS[weapon].m, dmg = stat.dmg(save.up.dmg);
      const sps = Math.min(N * rate, 44), bd = N * rate * dmg / sps;
      shotAcc += sps * dt;
      const vis = Math.min(N, MAXVIS), rng = range();
      while (shotAcc >= 1) {
        shotAcc -= 1;
        const k = (Math.random() * vis) | 0;
        const x = Math.max(-HALF + 0.2, Math.min(HALF - 0.2, armyX + FX[k]));
        if (bullets.length < 200) bullets.push({ x, z: pz + FZ[k] - 0.5, life: rng, dmg: bd });
      }
    }
    if (N <= 0) { N = 0; state = 'lost'; endT = 1.2; banner('ARMEE VERLOREN', 1200); }
    else if (B.dead) { state = 'won'; endT = 1.6; banner('SIEG!', 1500); }
    maxN = Math.max(maxN, N);
  }
  // Kugeln
  const d = BSPEED * dt;
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i], oz = b.z; b.z -= d; b.life -= d;
    const hit = state === 'run' ? findHit(b, oz) : null;
    if (hit) { damage(hit, b.dmg); bullets.splice(i, 1); continue; }
    if (b.life <= 0) bullets.splice(i, 1);
  }
  // Sägen bewegen sich immer (auch im Menü sichtbar)
  for (const e of L.events) if (e.type === 'saw') { e.x = Math.sin(timeT * e.w + e.phase) * (HALF - 1.3); e.mesh.position.x = e.x; e.blade.rotation.z -= dt * 14; }
  // Partikel
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; if (p.life <= 0 || p.y < -1) { parts.splice(i, 1); continue; }
    p.vy -= 18 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
  }
  // Boss-Animation
  const B = bossObj;
  if (B) {
    B.mesh.position.z = B.z; B.label.sprite.position.z = B.z;
    if (B.dead) { B.fall = Math.min(1, B.fall + dt * 1.5); B.mesh.rotation.x = -B.fall * Math.PI / 2; B.label.sprite.visible = false; }
    else {
      B.label.set(fmt(Math.ceil(B.hp)), '#c9302a');
      B.mesh.position.y = B.walk ? Math.abs(Math.sin(timeT * 6)) * 0.25 : 0;
      B.swing = Math.max(0, (B.swing || 0) - dt);
      const s = B.swing > 0 ? Math.sin(B.swing / 0.35 * Math.PI) * 1.4 : Math.sin(timeT * 6) * (B.walk ? 0.4 : 0.1);
      B.arms[0].rotation.x = s; B.arms[1].rotation.x = B.swing > 0 ? s : -s;
      B.flash = Math.max(0, (B.flash || 0) - dt);
      const f = B.flash > 0 ? 0.35 : 0; for (const m of B.mats) m.emissive.setRGB(f, f, f);
    }
  }
  // Tor-Texturen aktualisieren
  for (const e of L.events) if (e.type === 'gate' && !e.used) for (const g of e.gates) if (g.v !== g.shownV) gateTexture(g);
  // Endzustand
  if (state === 'won' || state === 'lost') { endT -= dt; if (endT <= 0) showEnd(state === 'won'); }
  shake = Math.max(0, shake - dt);
}

// ---------- Zeichnen ----------
function draw() {
  const running = state === 'run' || state === 'won' || state === 'lost';
  // Armee
  const vis = Math.min(N, MAXVIS);
  for (let i = 0; i < vis; i++) {
    const x = Math.max(-HALF + 0.25, Math.min(HALF - 0.25, armyX + FX[i]));
    const bob = running && !bossPhase && state === 'run' ? Math.abs(Math.sin(timeT * 13 + i * 1.7)) * 0.14 : 0;
    dummy.position.set(x, bob, pz + FZ[i]); dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(1); dummy.updateMatrix();
    for (const p of armyParts) p.setMatrixAt(i, dummy.matrix);
  }
  for (const p of armyParts) { p.count = vis; p.instanceMatrix.needsUpdate = true; }
  armyLabel.sprite.position.set(armyX, 2.1, pz + armyR() * 0.3); armyLabel.set(fmt(N), '#2f7cf6'); armyLabel.sprite.visible = N > 0;
  // Gegner
  let n = 0;
  for (const e of L.events) {
    if (e.type !== 'enemy') continue;
    e.label.sprite.visible = !e.dead && e.count > 0;
    if (e.dead || e.count <= 0) continue;
    e.r = e.size * (0.4 * Math.sqrt(Math.min(e.count, 120)) + 0.4);
    const c = Math.min(e.count, 120), col = KCOL[e.kind];
    dummy.scale.setScalar(e.size);
    for (let i = 0; i < c && n < 600; i++, n++) {
      const bob = e.active && e.speed > 0 ? Math.abs(Math.sin(timeT * (e.kind === 'runner' ? 18 : 12) + i * 1.3)) * 0.14 * e.size : 0;
      dummy.position.set(Math.max(-HALF + 0.25, Math.min(HALF - 0.25, e.x + EFX[i] * e.size)), bob, e.z + EFZ[i] * e.size);
      dummy.rotation.set(0, Math.PI, 0); dummy.updateMatrix();
      for (const p of enemyParts) p.setMatrixAt(n, dummy.matrix);
      enemyParts[0].setColorAt(n, col.body); enemyParts[2].setColorAt(n, col.helm);
    }
    dummy.scale.setScalar(1);
    e.label.sprite.position.set(e.x, 1.2 + e.size, e.z - e.r * 0.3); e.label.set(fmt(e.count), '#' + KINDS[e.kind].helm.toString(16).padStart(6, '0'));
  }
  for (const p of enemyParts) { p.count = n; p.instanceMatrix.needsUpdate = true; if (p.instanceColor) p.instanceColor.needsUpdate = true; }
  // Fass-Labels
  for (const e of L.events) if (e.type === 'barrel' && !e.dead) e.label.set(fmt(Math.ceil(e.hp)), '#1b2333');
  // Kugeln
  dummy.rotation.set(0, 0, 0);
  for (let i = 0; i < bullets.length; i++) { dummy.position.set(bullets[i].x, 0.75, bullets[i].z); dummy.updateMatrix(); bulletMesh.setMatrixAt(i, dummy.matrix); }
  bulletMesh.count = bullets.length; bulletMesh.instanceMatrix.needsUpdate = true;
  // Partikel
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i]; dummy.position.set(p.x, p.y, p.z); dummy.rotation.set(p.life * 9, p.life * 7, 0); dummy.scale.setScalar(Math.min(1, p.life * 2)); dummy.updateMatrix();
    partMesh.setMatrixAt(i, dummy.matrix); partMesh.setColorAt(i, tmpColor.setHex(p.c));
  }
  dummy.scale.setScalar(1);
  partMesh.count = parts.length; partMesh.instanceMatrix.needsUpdate = true; if (partMesh.instanceColor) partMesh.instanceColor.needsUpdate = true;
  // Kamera
  const sx = shake > 0 ? (Math.random() - 0.5) * shake : 0, sy = shake > 0 ? (Math.random() - 0.5) * shake : 0;
  const portrait = innerWidth / innerHeight < 0.75;
  camera.position.set(armyX * 0.35 + sx, (portrait ? 14 : 11) + sy, pz + (portrait ? 15 : 13));
  camera.lookAt(armyX * 0.2, 0, pz - (portrait ? 13 : 12));
  renderer.render(scene, camera);
  // HUD
  if (state !== 'menu') {
    const prog = Math.max(0, Math.min(1, pz / stopZ));
    $('hBar').style.width = 'calc(' + (prog * 100).toFixed(1) + '% - 6px)';
    $('hBoss').textContent = bossPhase ? fmt(Math.ceil(bossObj.hp)) + ' HP' : Math.round(prog * 100) + ' %';
    $('hCoins').textContent = fmt(save.coins + Math.floor(runCoins));
  }
}

// ---------- Menüs ----------
function renderMenu() {
  $('mLvl').textContent = save.level; $('mTheme').textContent = L.theme.n; $('mCoins').textContent = fmt(save.coins);
  const chips = [];
  if (L.elite) chips.push('<span class="chip elite">Elite-Boss · doppelte Belohnung</span>');
  if (L.unlock) chips.push('<span class="chip new">Neu: ' + L.unlock + '</span>');
  if (L.mod) chips.push('<span class="chip mod">' + L.mod.n + ' · ' + L.mod.d + '</span>');
  chips.push('<span class="chip">Boss: ' + L.boss.name + '</span>');
  $('mChips').innerHTML = chips.join('');
  $('ups').innerHTML = UPG.map(u => {
    const l = save.up[u.k], maxed = l >= u.max, c = cost(u, l);
    return '<div class="up"><div class="t"><div class="n">' + u.n + '<em>Stufe ' + l + '</em></div><div class="d">' + u.d(l) + (maxed ? '' : ' → ' + u.d(l + 1)) + '</div></div>' +
      '<button class="buy" type="button" id="buy-' + u.k + '" data-k="' + u.k + '"' + (maxed || save.coins < c ? ' disabled' : '') + '>' +
      (maxed ? 'MAX' : '<span class="coin"></span>' + fmt(c)) + '</button></div>';
  }).join('');
}
$('ups').addEventListener('click', ev => {
  const b = ev.target.closest('.buy'); if (!b || b.disabled) return;
  const u = UPG.find(x => x.k === b.dataset.k), l = save.up[u.k], c = cost(u, l);
  if (l >= u.max || save.coins < c) return;
  save.coins -= c; save.up[u.k]++; persist();
  if (u.k === 'start') { N = stat.start(save.up.start); }
  const total = Object.values(save.up).reduce((a, x) => a + x, 0);
  armyParts[2].material.color.setHex(HELMETS[Math.min(HELMETS.length - 1, Math.floor(total / 12))]);
  renderMenu(); vibrate(10);
});
function showMenu() {
  buildLevel(save.level); resetRun(); state = 'menu';
  $('end').hidden = true; $('hud').hidden = true; $('hWeapon').hidden = true; $('hint').hidden = true;
  $('menu').hidden = false; renderMenu();
}
function startRun() {
  $('menu').hidden = true; $('hud').hidden = false; $('hWeapon').hidden = false; $('hint').hidden = false; $('hint').style.opacity = 1;
  $('hWeapon').textContent = WEAPONS[0].n; $('hLvl').textContent = 'Lv ' + save.level;
  resetRun(); speed = RUN_SPEED * (L.has('sprint') ? 1.25 : 1); state = 'run';
  banner('LEVEL ' + save.level + '<small>' + (L.unlock ? 'Neu: ' + L.unlock : L.theme.n + (L.mod ? ' · ' + L.mod.n : '')) + '</small>', L.unlock ? 2200 : 1300);
  setTimeout(() => { $('hint').style.opacity = 0; }, 2500);
}
function showEnd(won) {
  state = 'over'; lastWin = won;
  const prog = Math.max(0, Math.min(1, pz / stopZ));
  const base = (25 + save.level * 9) * (L.elite ? 2 : 1) * stat.income(save.up.income) * (L.has('gold') ? 1.5 : 1);
  const earned = Math.round((won ? base : base * 0.5 * prog) + runCoins);
  save.coins += earned;
  if (won) { save.level++; save.best = Math.max(save.best, save.level); }
  persist();
  $('eTitle').textContent = won ? 'SIEG!' : 'NIEDERLAGE'; $('eTitle').className = 'result ' + (won ? 'win' : 'lose');
  $('eArmy').textContent = fmt(maxN); $('eKills').textContent = fmt(kills); $('eProg').textContent = Math.round(prog * 100) + '%';
  $('eCoins').textContent = fmt(earned);
  $('btnNext').textContent = won ? 'NÄCHSTES LEVEL' : 'UPGRADEN & NOCHMAL';
  $('hint').hidden = true; $('end').hidden = false;
}
$('btnGo').addEventListener('click', startRun);
$('btnNext').addEventListener('click', showMenu);

// ---------- Steuerung ----------
const keys = { l: false, r: false };
let drag = null;
$('c').addEventListener('pointerdown', e => { drag = { x: e.clientX, ax: armyTX }; });
addEventListener('pointermove', e => { if (!drag || state !== 'run') return; armyTX = drag.ax + (e.clientX - drag.x) / Math.min(innerWidth, 600) * 15; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointercancel', () => { drag = null; });
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.r = true;
  if ((e.key === ' ' || e.key === 'Enter') && state === 'menu' && document.activeElement === document.body) startRun();
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.r = false;
});

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
// Test-Hook (nur lesen/lenken)
let lastWin = null;
window.__armyRush = {
  get state() { return state; }, get N() { return N; }, get pz() { return pz; }, get x() { return armyX; },
  steer: x => { armyTX = x; }, L: () => L, save, lastWin: () => lastWin,
  // Schnell-Simulation ohne Rendern (für Balance-Tests): bot(api) lenkt jeden Schritt
  sim(bot, maxT = 300) { showMenu(); startRun(); let t = 0; while (state !== 'over' && t < maxT) { bot(this); update(1 / 30); t += 1 / 30; } return { won: lastWin, t, N, maxN, pz }; },
};

const boot = () => { showMenu(); requestAnimationFrame(t => { last = t; frame(t); }); };
(document.fonts && document.fonts.load ? Promise.race([document.fonts.load('68px "Lilita One"'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(boot, boot);
})();
</script>
